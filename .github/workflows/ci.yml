name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/codexa-api-e758/codexa/api:${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets Google confirm the job comes from this repo; no stored keys
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/427439852398/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@codexa-api-e758.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2

      # The packs and model rarely change: cache them rather than download 0.85 GB on every deploy.
      # Bump the key after uploading new ones to the bucket.
      - id: data
        uses: actions/cache@v4
        with:
          path: |
            data
            models
          key: codexa-data-v1
      - if: steps.data.outputs.cache-hit != 'true'
        run: gcloud storage cp -r gs://codexa-api-e758-data/data gs://codexa-api-e758-data/models .

      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - run: docker build -t "$IMAGE" . && docker push "$IMAGE"
      - run: gcloud run deploy codexa-api --image "$IMAGE" --region "$REGION"
