[project]
name = "codexa-api"
version = "0.1.0"
description = "Find Bible verses from a plain-English description and answer questions with citations: FastAPI, Gemini, Langfuse."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "numpy>=2.0",
  "onnxruntime>=1.19",
  "tokenizers>=0.20",
  "google-genai>=1.30",
  "langfuse>=4.0",
  "scalar-fastapi>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codexa_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
